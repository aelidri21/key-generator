<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Key Generator</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<h1>Key Generator</h1>

<form action="/" method="post">
    <label for="type">Choisissez ce que vous voulez générer :</label>
    <select id="type" name="type">
        <option value="codeSecret">Code secret</option>
        <option value="iban">IBAN</option>
    </select>
    <button type="submit">Générer</button>
</form>

<div th:if="${generatedValue != null}">
    <h3>Résultat :</h3>
    <p th:text="${generatedValue}"></p>
</div>

</body>
</html>
